name: ChromaLens
attributes:
    ORGANIZATIONNAME: Martin Johannesson
    BuildIndependentTargetsInParallel: YES

options:
    bundleIdPrefix: io.apparata
    createIntermediateGroups: true
    deploymentTarget:
        macOS: 26.0
    groupSortPosition: top
    generateEmptyDirectories: true
    usesTabs: false
    indentWidth: 4
    tabWidth: 4
    defaultConfig: Debug
    defaultSourceDirectoryType: syncedFolder

configs:
    Debug: debug
    Release: release

settings:
    base:
        SWIFT_VERSION: '6.2'
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Copyright © 2026 Martin Johannesson. All rights reserved.'
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: Yes
        ENABLE_USER_SCRIPT_SANDBOXING: No
        DEAD_CODE_STRIPPING: Yes
        STRING_CATALOG_GENERATE_SYMBOLS: Yes
        SWIFT_DEFAULT_ACTOR_ISOLATION: 'MainActor'
    configs:
        Release:
            SWIFT_COMPILATION_MODE: wholemodule

packages:
    AppDesign:
        path: Packages/AppDesign
    ColorVisionKit:
        path: Packages/ColorVisionKit
    Sparkle:
        url: https://github.com/sparkle-project/Sparkle
        exactVersion: 2.9.1
    AppRouting:
        url: https://github.com/apparata/AppRouting.git
        exactVersion: 0.9.2
    AttributionsUI:
        url: https://github.com/apparata/AttributionsUI.git
        exactVersion: 1.1.1
    CGMath:
        url: https://github.com/apparata/CGMath.git
        exactVersion: 1.1.2
    CollectionKit:
        url: https://github.com/apparata/CollectionKit.git
        exactVersion: 1.1.1
    Constructs:
        url: https://github.com/apparata/Constructs.git
        exactVersion: 2.1.2
    KeyValueStore:
        url: https://github.com/apparata/KeyValueStore.git
        exactVersion: 1.0.2
    MarkdownUI:
        url: https://github.com/apparata/MarkdownUI.git
        exactVersion: 1.0.3
    MathKit:
        url: https://github.com/apparata/MathKit.git
        exactVersion: 2.2.2
    SensibleStyling:
        url: https://github.com/apparata/SensibleStyling.git
        exactVersion: 0.2.1
    SettingsUI:
        url: https://github.com/apparata/SettingsUI.git
        exactVersion: 1.1.5
    SwiftUIToolbox:
        url: https://github.com/apparata/SwiftUIToolbox.git
        exactVersion: 2.0.0
    SystemKit:
        url: https://github.com/apparata/SystemKit.git
        exactVersion: 1.8.0
    TextToolbox:
        url: https://github.com/apparata/TextToolbox.git
        exactVersion: 1.4.0
    URLToolbox:
        url: https://github.com/apparata/URLToolbox.git
        exactVersion: 1.3.1
    UserDefaultsUI:
        url: https://github.com/apparata/UserDefaultsUI.git
        exactVersion: 1.0.1
    Zipcode:
        url: https://github.com/apparata/Zipcode.git
        exactVersion: 1.0.1
        
targets:
    ChromaLens:
        type: application
        platform: macOS
        sources:
            - path: ChromaLens
              excludes:
                - "Preview Content/Preview Assets.xcassets"
        dependencies:
            - package: AppDesign
              link: true
            - package: ColorVisionKit
            - package: Sparkle
            - package: AppRouting
            - package: AttributionsUI
            - package: CGMath
            - package: CollectionKit
            - package: Constructs
            - package: KeyValueStore
            - package: MarkdownUI
            - package: MathKit
            - package: SensibleStyling
            - package: SettingsUI
            - package: SwiftUIToolbox
            - package: SystemKit
            - package: TextToolbox
            - package: URLToolbox
            - package: UserDefaultsUI
            - package: Zipcode
        settings:
            base:
                MARKETING_VERSION: '1.0.0'
                CURRENT_PROJECT_VERSION: '1.0.0'
                GENERATE_INFOPLIST_FILE: Yes
                INFOPLIST_KEY_LSUIElement: Yes
                INFOPLIST_FILE: 'ChromaLens/macOS/Info.plist'
                ENABLE_PREVIEWS: Yes
                DEVELOPMENT_ASSET_PATHS: '"ChromaLens/Preview Content"'
                ASSETCATALOG_COMPILER_APPICON_NAME: DefaultAppIcon
                ENABLE_BITCODE: No
                ENABLE_APP_SANDBOX: Yes
                ENABLE_OUTGOING_NETWORK_CONNECTIONS: Yes
                ENABLE_USER_SELECTED_FILES: 'readwrite'
            configs:
                Debug:
                    # A stable signing identity keeps the Screen Recording
                    # permission across rebuilds (ad-hoc signing loses it).
                    DEVELOPMENT_TEAM: CQXRBQKG85
                    CODE_SIGN_STYLE: Manual
                    CODE_SIGN_IDENTITY: 'Apple Development'
                Release:
                    CODE_SIGN_IDENTITY: '-'

schemes:
    ChromaLens (Debug):
        build:
            targets:
                ChromaLens: [run, profile, analyze, archive]
        run:
            config: Debug
        profile:
            config: Release
        analyze:
            config: Debug
        archive:
            config: Release
            customArchiveName: ChromaLens
            revealArchiveInOrganizer: true
    ChromaLens (Release):
        build:
            targets:
                ChromaLens: [run, profile, analyze, archive]
        run:
            config: Release
        profile:
            config: Release
        analyze:
            config: Release
        archive:
            config: Release
            customArchiveName: ChromaLens
            revealArchiveInOrganizer: true
